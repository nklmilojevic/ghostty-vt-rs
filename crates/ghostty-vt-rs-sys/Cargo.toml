[package]
name = "ghostty-vt-rs-sys"
description = "Raw FFI bindings for libghostty-vt, Ghostty's terminal emulation library, with prebuilt static libraries"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nklmilojevic/ghostty-vt-rs"
readme = "README.md"
keywords = ["ghostty", "terminal", "vt", "ffi"]
categories = ["external-ffi-bindings", "command-line-interface"]
rust-version = "1.90"
links = "ghostty-vt"
build = "build.rs"
include = ["build.rs", "prebuilt.rs", "src/**", "tools/**", "tests/**", "README.md", "LICENSE*"]

[package.metadata.ghostty]
# The libghostty-vt release (Ghostty tag vt-<version>) and its commit, which these bindings and
# the prebuilt libraries are built from (build.rs's GHOSTTY_COMMIT); read by dependents' tooling.
version = "1.0.0"
commit = "0fa3d577a5614150ff8e2c152de5fb9d5c6d2dec"

[package.metadata.docs.rs]
# build.rs skips the native library on docs.rs; the checked-in bindings are enough.
all-features = false

[lib]
doctest = false

[features]
pkg-config = ["dep:pkg-config"]
link-dynamic = []
bindgen-tool = ["dep:bindgen", "dep:libc", "dep:heck"]

[dependencies]
bindgen = { version = "0.73.0", optional = true }
libc = { version = "0.2", optional = true }
heck = { version = "0.5", optional = true }

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
sha2 = "0.11"

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]

[[example]]
name = "wasm_smoke"
crate-type = ["cdylib"]

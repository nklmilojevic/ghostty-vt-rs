name: Publish

# Publishes the crates to crates.io for a version tag, with crates.io trusted publishing (no
# stored token). Trusted publishing can only be set up once the crate exists: until then the
# crates-io environment's CARGO_REGISTRY_TOKEN secret publishes (delete it afterwards).
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tag, version and prebuilt archives agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/ghostty-vt-rs-sys/Cargo.toml | head -n1)"
          [[ "$TAG" == "v$version" ]] || { echo "::error::tag $TAG is not v$version"; exit 1; }
          scripts/check-pins.sh --release
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        # Fails until trusted publishing is set up; the secret then stands in.
        continue-on-error: true
      # The package build downloads its prebuilt library, so no Zig is needed here.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p ghostty-vt-rs-sys
